name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth with local dev. Newer Node exposes a native
          # localStorage global that shadows jsdom's and breaks the suite.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Lint our own source strictly. Catches unused imports and the like that
      # the build step does not fail on. Uses eslint-config-react-app, kept as a
      # standalone dev dependency after the CRA -> Vite migration.
      - run: npx eslint src --ext .js,.jsx --max-warnings=0

      # Coverage thresholds live in vite.config.js under test.coverage.thresholds.
      # They are a ratchet pinned at the coverage on the day they were added, not
      # a target. Raise them as coverage rises; never lower them to make a build
      # pass.
      - run: npm run test:coverage

      # Production build. Vite (unlike CRA) does not treat warnings as fatal, so
      # no CI-flag juggling is needed. Output goes to app/dist.
      - run: npm run build
