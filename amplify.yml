version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        # Vite emits dist/ (CRA emitted build/). Root amplify.yml overrides the
        # Amplify console spec and is versioned per-branch, so the cutover from
        # build/ to dist/ lands automatically when this branch merges.
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
    appRoot: app
